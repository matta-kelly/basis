# basis's dev image, built once for each set of inputs: scripts/dev-image.sh hashes the files below
# (the inputs, its own line `inputs=`), builds and smokes ghcr.io/matta-kelly/basis-dev:<hash> only
# when ghcr lacks it, and points :main at it. A push to main that changes no input does not start
# it. Not a required check, so the path filter is allowed (ci.md, When it runs).
name: dev-image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/devcontainer.json
      - .devcontainer/Containerfile
      - package-lock.json
      - scripts/dev-image.sh
      - scripts/dev-image-smoke.sh
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, none cancelled: the last push's run ends last, so :main is the last main's image.
concurrency:
  group: dev-image
  cancel-in-progress: false

jobs:
  image:
    # A dispatch from a branch builds nothing: trunk alone moves :main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one job that writes to the registry, with the run's own token, never printed.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: scripts/dev-image.sh ensure
      - run: scripts/dev-image.sh promote
