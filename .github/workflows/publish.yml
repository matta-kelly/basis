# Publishes a package of this repo on npm when a version tag of it is pushed: @mku1tra/basis by a `v*` tag, from the
# repo's root, and @mku1tra/it by an `it-v*` tag, from it/. The same check set first, then `npm publish` by trusted
# publishing (OIDC), with no token and with provenance. The tag is the gate: a ruleset lets only an admin of the repo
# make a version tag, of either prefix. npmjs.com holds the other half: each package's Trusted Publisher names this repo and this file.
name: publish

on:
  push:
    tags: ["v*", "it-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 has npm 10.
      - run: npm install --global npm@11.21.0
      # The tag names the package: `v<version>` is basis, at the root, and `it-v<version>` is it, in it/. Its version is
      # the one in that package's package.json.
      - name: The tag is the package's version
        run: |
          case "$GITHUB_REF_NAME" in
            it-v*) folder=it prefix=it-v ;;
            *) folder=. prefix=v ;;
          esac
          echo "FOLDER=$folder" >>"$GITHUB_ENV"
          test "$prefix$(node -p "require('./$folder/package.json').version")" = "$GITHUB_REF_NAME"
      - run: scripts/check.sh
      # A version npm has already is left as it is: a run again, or the first version, published by hand through
      # scripts/published.sh. The package.json npm publishes has no workspaces: scripts/published.sh takes them out for
      # the command, as install-check packs it, and basis's prepublishOnly stops a publish not run through it.
      - name: Publish, if npm does not have this version
        working-directory: ${{ env.FOLDER }}
        run: |
          package=$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')
          if npm view "$package" version >/dev/null 2>&1; then
            echo "npm has $package already"
          else
            "$GITHUB_WORKSPACE/scripts/published.sh" npm publish
          fi
