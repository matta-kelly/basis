# Publishes basis to npm, as @mku1tra/basis, when a version tag is pushed: the same check set first, then
# `npm publish` by trusted publishing (OIDC), with no token. npm gives the package provenance from this run.
# npmjs.com holds the other half: the package's Trusted Publisher names this repo and this file.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 has npm 10.
      - run: npm install --global npm@11.21.0
      - name: The tag is the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: scripts/check.sh
      # A version npm has already is left as it is: a run again, or the first version, published by hand.
      - name: Publish, if npm does not have this version
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "@mku1tra/basis@$version" version >/dev/null 2>&1; then
            echo "npm has @mku1tra/basis@$version already"
          else
            npm publish
          fi
