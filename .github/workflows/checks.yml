# The checks every push runs, to every branch, main included: the ruleset on main requires this job's result on the
# exact commit, so it has no path filter (a required check that a path filter skips stays pending).
# The check set is in `scripts/check.sh`, which `just check` runs too: this file sets up the toolchain and calls it.
name: checks

on:
  # GitHub checks a release tag only: every land is checked on this machine, at the local main.
  push:
    tags: ['v*', 'que-pair-*']
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a newer push to a branch cancels the older run. On main a running run is not cancelled, but GitHub
# keeps one waiting run per group, so a newer push replaces a waiting one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: scripts/check.sh
