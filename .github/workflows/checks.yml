# The check of this repo on every push: scripts/check.sh, in the dev image, the same file `just check` runs. Copy as it is.
# The ruleset on main requires the job `checks` on the exact commit, so the trigger has no path filter: the script skips
# what a change does not need.
name: checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The dev image this commit runs on: its own tag, or :main when ghcr has not built its inputs.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin
      - id: image
        run: echo "image=$(scripts/dev-image.sh ref)" >> "$GITHUB_OUTPUT"

  check:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: 'echo "dev image: ${{ needs.image.outputs.image }}"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # all history, so the script can read what the change touched against origin/main
          fetch-depth: 0
          persist-credentials: false
      # A job container runs as root, which reads every file and owns none of the checkout: the check runs as
      # the image's node, as in the dev container, over a checkout node owns.
      - run: chown -R node:node "$GITHUB_WORKSPACE" && runuser -u node -- env HOME=/home/node scripts/check.sh

  # The one result a ruleset requires. It always runs, so a failed image job cannot read as a pass.
  checks:
    needs: [image, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          IMAGE: ${{ needs.image.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "image=$IMAGE check=$CHECK"
          [ "$IMAGE" = success ] && [ "$CHECK" = success ]
