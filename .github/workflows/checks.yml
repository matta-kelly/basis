# The checks every push to main runs, and every pull request.
# The check set is in `scripts/check.sh`, which `just check` runs too: this file sets up the toolchain and calls it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. A run on main is never cancelled.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: scripts/check.sh
